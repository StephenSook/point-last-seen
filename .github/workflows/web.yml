name: web

# Web command post: typecheck, unit tests, a build with placeholder config (proves it compiles; never
# deployed) and the browser checks that need no backend, run against that build. Runs on pull requests to main and on main (Actions minutes are budgeted), when web/, the
# shared engine and constants it imports, the root package files or this workflow change.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install (clean, from the lockfile)
        run: npm ci
      - name: Web typecheck
        run: npm run typecheck -w web
      - name: Web unit tests
        run: npm test -w web
      # The public-run exporter's output must pass the judge replay reader, which lives here (web/src/extras/replay):
      # a reader change re-runs that cross-check, not only the reader's own tests.
      - name: Exported run passes the replay reader
        run: |
          npm run typecheck -w tools/export-run
          npm test -w tools/export-run
      - name: Web build (placeholder config; proves it compiles, never deployed)
        env:
          VITE_FIREBASE_API_KEY: ci-build-check
          VITE_FIREBASE_AUTH_DOMAIN: ci-build-check.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-build-check
          VITE_FIREBASE_STORAGE_BUCKET: ci-build-check.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: "1:0:web:0"
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ci-build-check
        run: npm run build -w web
      # Browser checks that need no Firebase backend (tagged @no-backend: the judge page, the join
      # page, /llms.txt, phone fit and axe on both pages), against the placeholder build above.
      - name: Install the Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser checks with no backend
        working-directory: web
        run: npx playwright test -c e2e/ci.config.ts
      # The clip harnesses make their test clips with ffmpeg (the repository keeps every .mp4 out), and the runner
      # image does not ship it. The script bounds each apt call and tries twice, since a stalled mirror once held
      # this step until the job's limit.
      - name: Install ffmpeg
        timeout-minutes: 7
        run: bash scripts/ci/install-ffmpeg.sh
      # Component harnesses (map, beat, plan, sightings, family, clips, ...) and the extras lane's pages, on the
      # Vite dev server with Playwright's Chromium. The few tests that need Chrome's built-in model are left out.
      - name: Component harness checks
        working-directory: web
        env:
          CI: "true"
        run: npx playwright test -c e2e/harness.config.ts --grep-invert "built-in model"
      - name: Extras harness checks
        working-directory: web
        env:
          CI: "true"
        run: npx playwright test -c e2e/extras.config.ts
