name: CI

# Actions minutes are budgeted: runs only on pull requests to main and on main. Lane branch pushes
# run no CI; lanes verify each commit with scripts/ci-local.sh and record its exit code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pushes to one pull request supersede each other; every main commit keeps its own run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Rules gate
        run: python3 -I scripts/rules_gate.py .
      - name: Rules gate tests
        run: python3 -I -m pytest scripts/test_rules_gate.py -q
      - name: Schema parity
        run: python3 -I scripts/check_schema_parity.py .
      - name: Rules validators match the schemas
        run: python3 -I tools/rules/gen_rules_validators.py --check
      - name: Remote Config keys match the code, and no engine number is tunable
        run: python3 -I scripts/check_rc_keys.py .
      # Reports hits while the repository is private and fails once it is public, from GitHub's own flag.
      - name: Public hygiene (no internal process names or private paths)
        run: python3 -I scripts/hygiene_guard.py . ${{ github.event.repository.private == false && '--public' || '' }}
      - name: Schema parity, vector generator and seeding tool tests
        run: python3 -I -m pytest scripts/test_check_schema_parity.py scripts/test_firebase_config.py scripts/test_workflow_paths.py scripts/test_ci_local.py tools/vectors/test_make_vectors.py tools/seed/test_seed_drill.py tools/seed/test_seed_segments.py tools/seed/test_segment_contract.py tools/rules/test_gen_rules_validators.py scripts/test_emulator_config.py scripts/test_rc_publish.py scripts/test_models_probe.py scripts/test_check_rc_keys.py scripts/test_hygiene_guard.py scripts/test_templates.py scripts/test_appcheck_control.py scripts/test_media_probe.py scripts/test_judging_window.py tools/extras/test_build_elevation.py tools/extras/test_publish_scam.py tools/extras/test_publish_drill_run.py scripts/test_judge_seed_check.py scripts/test_phone_vectors.py -q
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Secret scan (full history)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'
