name: Judge quota probe

# Hourly, through judging (ends 2026-12-16): reads today's count of judge practice searches
# (ops/judgeSessions-YYYY-MM-DD) and fails when fewer than 10 of the day's searches are left, so the team hears
# before a judge is refused. It never starts a session. The script retires itself after 2026-12-22. A failed run
# emails the repo owner. Check this workflow's state and its newest run's age, not only green runs.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judge-quota
  cancel-in-progress: false

jobs:
  quota:
    name: quota
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Judge practice quota left today
        env:
          APPCHECK_DEBUG_TOKEN_CI: ${{ secrets.APPCHECK_DEBUG_TOKEN_CI }}
        run: python3 -I scripts/judge_quota_probe.py
