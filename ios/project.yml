# XcodeGen spec for the searcher app. Generate with:
#   xcodegen generate --spec ios/project.yml
# The generated PLS.xcodeproj is not tracked; this file is the source.
name: PLS
options:
  bundleIdPrefix: app.pointlastseen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The Apple developer team that signs device builds; App Attest in Firebase is registered
    # for this team. Simulator builds sign ad hoc so the test bundle loads.
    DEVELOPMENT_TEAM: Y8XVCMLQCZ
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.2.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
  PLSCore:
    path: PLSCore
targets:
  PLS:
    type: application
    platform: iOS
    sources:
      - path: PLS
      - path: PLSShared
      - path: ../shared/constants/engine-params.json
        buildPhase: resources
      - path: ../shared/constants/evidence-terms.json
        buildPhase: resources
      - path: ../shared/constants/approach-notes.json
        buildPhase: resources
      - path: ../shared/constants/urgency.json
        buildPhase: resources
      - path: ../shared/constants/tracking-aids.json
        buildPhase: resources
      - path: ../shared/constants/language-words.json
        buildPhase: resources
      - path: ../shared/constants/grounding-words.json
        buildPhase: resources
      - path: ../shared/practice/ios-practice-pack.json
        buildPhase: resources
      - path: ../shared/grid/kennesaw-mountain-drill.pmtiles
        buildPhase: resources
      - path: ../shared/grid/piedmont-park-dev.pmtiles
        buildPhase: resources
    info:
      path: PLS/Info.plist
      properties:
        CFBundleDisplayName: Point Last Seen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocationWhenInUseUsageDescription: Used to place your report on the search map.
        NSCameraUsageDescription: Used to read a photo of something found, on this phone. The photo is not kept.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        # The commit a build was made from (a device build passes PLS_BUILD_COMMIT); the eval records it.
        PLSBuildCommit: $(PLS_BUILD_COMMIT)
    entitlements:
      path: PLS/PLS.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pointlastseen.field
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PLS_BUILD_COMMIT: unknown
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    postBuildScripts:
      # The report-reading eval's answer key, in Debug builds only, like the eval screen that reads it. The file is
      # the pinned one in docs/evidence/eval, copied as it is.
      - name: Bundle the eval answer key (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            cp "${SRCROOT}/../docs/evidence/eval/pls-drill-reports-v1.json" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          fi
        inputFiles:
          - $(SRCROOT)/../docs/evidence/eval/pls-drill-reports-v1.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/pls-drill-reports-v1.json
      # Uploads the dSYMs so Crashlytics can symbolicate field crashes. Release builds only, so
      # simulator and debug builds send nothing. The input files are what the script reads under
      # user script sandboxing (Firebase's documented list).
      - name: Upload dSYMs to Crashlytics
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebasePerformance
      - package: Firebase
        product: FirebaseCrashlytics
      - package: MapLibre
        product: MapLibre
      - package: PLSCore
        product: PLSCore
      - target: PLSWidgets
  PLSWidgets:
    # The Action-button control (P-08) and the team's Live Activity (P-07).
    type: app-extension
    platform: iOS
    sources:
      - path: PLSWidgets
      - path: PLSShared
    info:
      path: PLSWidgets/Info.plist
      properties:
        CFBundleDisplayName: Point Last Seen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pointlastseen.field.widgets
        TARGETED_DEVICE_FAMILY: "1"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: PLSCore
        product: PLSCore
  PLSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PLSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pointlastseen.field.tests
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    dependencies:
      - target: PLS
schemes:
  PLS:
    build:
      targets:
        PLS: all
        PLSTests: [test]
    test:
      targets: [PLSTests]
